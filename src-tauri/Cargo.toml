[package]
name = "locaray"
version = "0.1.1"
description = "A precise desktop utility for temporary Cloudflare Quick Tunnels"
default-run = "locaray"
authors = ["LocaRay contributors"]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[lib]
name = "locaray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
netstat2 = "=0.11.2"
regex = "=1.13.1"
reqwest = "=0.13.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = "=0.39.6"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-store = "=2.4.4"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
